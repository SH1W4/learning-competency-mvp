name: Frontend browser smoke

on:
  pull_request:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-browser.yml"
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-browser.yml"

permissions:
  contents: read

jobs:
  responsive-browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend and browser-test dependencies
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1

      - name: Audit locked frontend dependencies
        id: dependency-audit
        continue-on-error: true
        run: |
          corepack pnpm audit --json > /tmp/lastro-pnpm-audit.json || audit_status=$?
          node -e "const fs=require('fs');const p='/tmp/lastro-pnpm-audit.json';try{const a=JSON.parse(fs.readFileSync(p,'utf8'));const advisories=a.advisories||a.metadata?.vulnerabilities||{};console.log(JSON.stringify({auditExitCode:Number(process.env.AUDIT_STATUS||0),metadata:a.metadata||null,advisoryCount:Array.isArray(advisories)?advisories.length:Object.keys(advisories).length,advisories},null,2))}catch(e){console.log(fs.readFileSync(p,'utf8'));process.exitCode=1}"
        env:
          AUDIT_STATUS: ${audit_status:-0}

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dependency-audit
          path: /tmp/lastro-pnpm-audit.json
          if-no-files-found: warn

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/lastro-next.log 2>&1 &
          echo $! > /tmp/lastro-next.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/lastro-next.log
          exit 1

      - name: Run responsive and keyboard smoke tests
        run: npx playwright test tests/mobile-responsive.pw.cjs

      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/lastro-next.log
          if-no-files-found: ignore
