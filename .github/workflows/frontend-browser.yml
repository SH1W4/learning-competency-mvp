name: Frontend browser smoke

on:
  pull_request:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-browser.yml"
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-browser.yml"

permissions:
  contents: read

jobs:
  responsive-browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend and browser-test dependencies
        run: npm install --no-save --package-lock=false @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/lastro-next.log 2>&1 &
          echo $! > /tmp/lastro-next.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/lastro-next.log
          exit 1

      - name: Run responsive and keyboard smoke tests
        run: npx playwright test tests/mobile-responsive.spec.cjs

      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/lastro-next.log
          if-no-files-found: ignore
