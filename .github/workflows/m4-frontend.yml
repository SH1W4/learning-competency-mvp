name: M4 frontend validation

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/m4-frontend.yml"
  push:
    branches: [feat/public-m4-frontend-v0]
    paths:
      - "frontend/**"
      - ".github/workflows/m4-frontend.yml"
  workflow_dispatch:

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
