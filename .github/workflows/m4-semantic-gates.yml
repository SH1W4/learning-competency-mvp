name: M4 semantic and runtime gates

on:
  pull_request:
    branches: [feat/public-m4-frontend-v0]
    paths:
      - "src/**"
      - "tests/**"
      - "frontend/**"
      - ".github/workflows/m4-semantic-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked root dependencies
        run: npm ci
      - name: Run Vitest suite including semantic adapter and runtime integration
        run: npm test
      - name: Run TypeScript typecheck
        run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
      - name: Production UI/API smoke gates
        run: node scripts/m4-api-smoke.mjs
      - name: Audit production frontend dependencies
        run: pnpm audit --prod --audit-level high
