name: PR31 exact-SHA Vitest and typecheck

on:
  pull_request:
    branches: ["feat/public-m4-frontend-v0"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  exact-sha-validation:
    if: github.event.pull_request.number == 31
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact current PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Assert checked-out SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $actual"
          test "$actual" = "$EXPECTED_SHA"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Audit production dependencies
        if: always()
        run: npm audit --omit=dev --audit-level=high
