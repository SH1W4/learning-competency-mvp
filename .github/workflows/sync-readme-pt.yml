name: Sync Portuguese README

on:
  push:
    branches: [main]
    paths:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-portuguese-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Translate README.md to Portuguese
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_README_MODEL || 'gpt-6-luna' }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::warning::OPENAI_API_KEY is not configured; skipping Portuguese README synchronization."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import urllib.request

          source_path = "README.md"
          target_path = "README.pt.md"

          with open(source_path, "r", encoding="utf-8") as f:
              source = f.read()

          prompt = """Translate the canonical repository README from English to Brazilian Portuguese.

You are maintaining a synchronized localization, not rewriting the document.

Rules:
1. Preserve the exact Markdown structure, heading hierarchy, tables, bullets, blockquotes, code fences, commands, file paths, repository paths, identifiers, URLs, anchors, percentages, numbers, model names, product names, protocol names, technical states, and code examples.
2. Translate only natural-language prose.
3. Do not add, remove, summarize, reorder, or reinterpret sections.
4. Preserve every link target exactly. Link labels may be translated when they are prose.
5. Keep technical state identifiers such as DEMONSTRATED, IN_DEVELOPMENT, CONFLICT, AGREEMENT, INSUFFICIENT EVIDENCE, HUMAN ADJUDICATION and ATTESTATION unchanged when they are system states or protocol terms.
6. Keep LASTRO, Solana, Consensus Core, Dynamic Role Architecture and other proper product/project names unchanged.
7. Keep the opening note that README.md is the canonical editorial source, but translate it naturally into Brazilian Portuguese.
8. Return ONLY the complete translated Markdown document. No preamble, explanation, or code-fence wrapper around the entire document.

Canonical English README:
""" + source

          payload = {
              "model": os.environ.get("OPENAI_MODEL", "gpt-6-luna"),
              "input": prompt,
              "max_output_tokens": 20000,
          }

          request = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + os.environ["OPENAI_API_KEY"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=180) as response:
              data = json.load(response)

          output = data.get("output_text")
          if not output:
              parts = []
              for item in data.get("output", []):
                  for part in item.get("content", []):
                      if part.get("type") == "output_text" and part.get("text"):
                          parts.append(part["text"])
              output = "".join(parts)

          if not output.strip():
              raise RuntimeError("OpenAI returned an empty translation.")

          with open(target_path, "w", encoding="utf-8", newline="") as f:
              f.write(output.rstrip() + "\n")
          PY

      - name: Validate generated README
        run: |
          test -s README.pt.md
          git diff --check
          grep -q '^# LASTRO' README.pt.md

      - name: Commit synchronized README.pt.md
        run: |
          if git diff --quiet -- README.pt.md; then
            echo "README.pt.md is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.pt.md
          git commit -m "docs(i18n): sync Portuguese README"
          git push
